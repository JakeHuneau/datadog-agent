---
tests_windows-x64:
  extends: [.bazel:runner:windows-amd64, .bazel:test]
  variables:
    GIT_DEPTH: 0
    POWERSHELL_SCRIPT: >-
      & './tools/ci/bazel-coverage-windows.ps1'
      -BepFile 'bazel-bep.json'
      -ResultJson 'test_output.json'
      -JunitTar 'junit-${CI_JOB_NAME_SLUG}.tgz'
      -CoverageOut 'coverage-bazel-${CI_JOB_NAME_SLUG}.out'
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - test_output.json
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
      - coverage-bazel-*.out

.tests_windows_sysprobe:
  stage: source_test
  needs: ["setup_agent_version", "go_deps", "go_tools_deps"]
  extends: [.windows_docker_default, .bazel:defs:cache:windows]
  script:
    - $ErrorActionPreference = "Stop"
    - !reference [.sanitize_goproxy_windows]
    - >
      .\tools\ci\docker-run-with-bazel-cache.ps1
      -m 16384M
      -v "$(Get-Location):c:\mnt"
      -e AWS_NETWORKING=true
      -e CI
      -e GITLAB_CI
      -e CI_PIPELINE_ID
      -e CI_PROJECT_NAME
      -e SIGN_WINDOWS_DD_WCS=true
      -e WINDOWS_SIGNING_CERT
      -e WINDOWS_SIGNING_CONFIG
      -e GOMODCACHE="c:\modcache"
      -e GOPROXY
      -e GONOSUMDB
      -e PIP_INDEX_URL
      -e CI_IDENTITIES_GITLAB_ID_TOKEN
      ${WINBUILDIMAGE}
      c:\mnt\tasks\winbuildscripts\sysprobe.bat
    - If ($lastExitCode -ne "0") { throw "Previous command returned $lastExitCode" }
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/test/new-e2e/tests/sysprobe-functional/artifacts

.tests_windows_secagent:
  stage: source_test
  needs: ["setup_agent_version", "go_deps", "go_tools_deps"]
  extends: [.windows_docker_default, .bazel:defs:cache:windows]
  variables:
    GIT_DEPTH: 0  # Full history: security-agent.e2e-prepare-win embeds git merge-base
  script:
    - $ErrorActionPreference = "Stop"
    - !reference [.sanitize_goproxy_windows]
    - >
      .\tools\ci\docker-run-with-bazel-cache.ps1
      -m 16384M
      -v "$(Get-Location):c:\mnt"
      -e AWS_NETWORKING=true
      -e CI
      -e GITLAB_CI
      -e CI_PIPELINE_ID
      -e CI_PROJECT_NAME
      -e SIGN_WINDOWS_DD_WCS=true
      -e WINDOWS_SIGNING_CERT
      -e WINDOWS_SIGNING_CONFIG
      -e GOMODCACHE="c:\modcache"
      -e GOPROXY
      -e GONOSUMDB
      -e PIP_INDEX_URL
      -e CI_IDENTITIES_GITLAB_ID_TOKEN
      ${WINBUILDIMAGE}
      c:\mnt\tasks\winbuildscripts\secagent.bat
    - If ($lastExitCode -ne "0") { throw "Previous command returned $lastExitCode" }
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/test/new-e2e/tests/security-agent-functional/artifacts

tests_windows_sysprobe_x64:
  extends: .tests_windows_sysprobe
  rules:
    - !reference [.except_light_pipeline]
    - when: on_success
  variables:
    ARCH: "x64"

tests_windows_secagent_x64:
  extends: .tests_windows_secagent
  rules:
    - !reference [.except_light_pipeline]
    - when: on_success
  variables:
    ARCH: "x64"
